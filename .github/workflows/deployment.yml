name: Docker Image Deployment

on:
  push:
    branches: [main, releases/*]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    environment:
      name: production

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64

    name: Docker Build for Linux x64

    runs-on: ${{ matrix.os }}

    steps:

    - name: Checkout
      uses: actions/checkout@v6.1.0

    - name: Docker Login
      # You may pin to the exact commit or the version.
      # uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
      uses: docker/login-action@v4.8.0
      with:
        # Username used to log against the Docker registry
        username: ${{ secrets.DOCKER_LOGIN }}
        # Password or personal access token used to log against the Docker registry
        password: ${{ secrets.DOCKER_PASS }}

    - name: Pull and increment build and push to Docker Hub
      # You may pin to the exact commit or the version.
      # uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      uses: docker/build-push-action@v7.4.0
      with:
        file: Dockerfile
        pull: true
        push: true
        platforms: ${{ matrix.platform }}
        tags: mateuszokroj1/ubuntu-dev-base:latest
