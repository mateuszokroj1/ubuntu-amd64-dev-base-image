name: Docker Image CI - main

env:
  tag: mateuszokroj1/ubuntu-dev-base:extended-latest

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:

  build:
    environment:
      name: testing

    name: Docker Build for Linux x64

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.os }}

    steps:

    - name: Checkout
      uses: actions/checkout@v6.1.0

    - name: Docker Login
      # You may pin to the exact commit or the version.
      # uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
      uses: docker/login-action@v4.8.0
      with:
        # Username used to log against the Docker registry
        username: ${{ secrets.DOCKER_LOGIN }}
        # Password or personal access token used to log against the Docker registry
        password: ${{ secrets.DOCKER_PASS }}

    - name: Pull and increment build
      # You may pin to the exact commit or the version.
      # uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      uses: docker/build-push-action@v7.4.0
      with:
        file: Dockerfile
        pull: true
        push: false
        platforms: ${{ matrix.platform }}
        tags: ${{ env.tag }}

    - name: Analyze CVEs
      # You may pin to the exact commit or the version.
      # uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864
      uses: docker/scout-action@v1.26.0
      with:
        # Image to analyze
        image: ${{ env.tag }}
        command: cves
